# status: beta
# last_tested_version: stable
# platform_notes: ARMv7 and ARM64 compatible. Requires adequate resources for video conferencing.
# breaking_changes: none
services:
  prosody:
    image: jitsi/prosody:stable
    container_name: piselfhosting-jitsi-prosody
    restart: unless-stopped
    networks:
      - piselfhosting_net
    volumes:
      - "{{ DATA_ROOT }}/jitsi/prosody/config:/config"
      - "{{ DATA_ROOT }}/jitsi/prosody/plugins:/prosody-plugins-custom"
    environment:
      - XMPP_SERVER=prosody
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - JICOFO_AUTH_USER=jicofo
      - JICOFO_AUTH_PASSWORD={{ JICOFO_AUTH_PASSWORD }}
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD={{ JVB_AUTH_PASSWORD }}
      - JICOFO_COMPONENT_SECRET={{ JICOFO_COMPONENT_SECRET }}
      - JIGASI_XMPP_USER=jigasi
      - JIGASI_XMPP_PASSWORD=jigasi_pass
      - JIBRI_XMPP_USER=jibri
      - JIBRI_XMPP_PASSWORD=jibri_pass
  jicofo:
    image: jitsi/jicofo:stable
    container_name: piselfhosting-jitsi-jicofo
    restart: unless-stopped
    networks:
      - piselfhosting_net
    volumes:
      - "{{ DATA_ROOT }}/jitsi/jicofo:/config"
    environment:
      - XMPP_SERVER=prosody
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - JICOFO_AUTH_USER=jicofo
      - JICOFO_AUTH_PASSWORD={{ JICOFO_AUTH_PASSWORD }}
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD={{ JVB_AUTH_PASSWORD }}
      - JICOFO_COMPONENT_SECRET={{ JICOFO_COMPONENT_SECRET }}
    depends_on:
      - prosody
  jvb:
    image: jitsi/jvb:stable
    container_name: piselfhosting-jitsi-jvb
    restart: unless-stopped
    networks:
      - piselfhosting_net
    ports:
      - "{{ JITSI_JVB_PORT }}:10000/udp"
      - "3030:3030/tcp"
    volumes:
      - "{{ DATA_ROOT }}/jitsi/jvb:/config"
    environment:
      - XMPP_SERVER=prosody
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD={{ JVB_AUTH_PASSWORD }}
      - JVB_PORT={{ JITSI_JVB_PORT }}
      - JVB_TCP_PORT=3030
      - JVB_STUN_SERVERS=stun.l.google.com:19302,stun1.l.google.com:19302,stun2.l.google.com:19302
      - JVB_TOS=16
      - DOCKER_HOST_ADDRESS={{ JITSI_PUBLIC_URL }}
    depends_on:
      - prosody
  web:
    image: jitsi/web:stable
    container_name: piselfhosting-jitsi-web
    restart: unless-stopped
    networks:
      - piselfhosting_net
    ports:
      - "{{ JITSI_HTTP_PORT }}:80"
      - "{{ JITSI_HTTPS_PORT }}:443"
    volumes:
      - "{{ DATA_ROOT }}/jitsi/web:/config"
    environment:
      - XMPP_SERVER=prosody
      - XMPP_DOMAIN=meet.jitsi
      - JICOFO_AUTH_DOMAIN=auth.meet.jitsi
      - PUBLIC_URL={{ JITSI_PUBLIC_URL }}
      - JVB_PORT={{ JITSI_JVB_PORT }}
      - ENABLE_HTTP_REDIRECT=1
      - TZ=Europe/London
    depends_on:
      - prosody
      - jicofo
      - jvb
networks:
  piselfhosting_net:
    external: true