# status: "tested"
# last_tested_version: "2.0.2"
# platform_notes: "Tested on Proxmox LXC: docker (2.0.2, 2026-11-27), podman (master, 2026-09-14); Proxmox VM: docker (master, 2026-09-14), podman (master, 2026-09-14)."
# breaking_changes: "None"
services:
  octoprint:
    container_name: octoprint
    image: octoprint/octoprint:{{ component_version }}
    restart: unless-stopped
    ports:
      - "{{ PORT_OCTOPRINT | default(5000) }}:80"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/octoprint:/octoprint"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
