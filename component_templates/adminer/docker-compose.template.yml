# status: "tested"
# last_tested_version: "6.0.1"
# platform_notes: "Tested on Proxmox LXC: docker (8.4.25, 2026-09-12), podman (6.0.1, 2026-09-12); Proxmox VM: docker (6.0.1, 2026-09-12), podman (6.0.1, 2026-09-12)."
# breaking_changes: "None"
services:
  adminer:
    image: adminer:{{ component_version }}
    container_name: njorddeploy-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_WEB_PORT:-8084}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: "${ADMINER_DEFAULT_SERVER:-mariadb}"
      ADMINER_DESIGN: "${ADMINER_DESIGN:-pepa-linha}"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
