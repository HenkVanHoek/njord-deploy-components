# status: beta
# last_tested_version: latest
# platform_notes: Requires root access for persistent storage and network operations. Works on Linux, Windows, macOS, and Raspberry Pi.
# breaking_changes: none
version: '3.8'
services:
  njorddeploy-dns-server:
    container_name: njorddeploy-dns-server
    image: "{{ image_name }}:{{ component_version }}"
    user: "0:0"
    networks:
      - njorddeploy_net
    ports:
      - "{{ DNS_WEB_PORT }}:5380/tcp" #DNS web console (HTTP)
      - "{{ DNS_UDP_PORT }}:53/udp" #DNS service
      - "{{ DNS_TCP_PORT }}:53/tcp" #DNS service
    volumes:
      - "{{ CONFIG_BASE_PATH }}/dns-server/config:/etc/dns"
      - "{{ DATA_ROOT }}/dns-server/logs:/var/log/technitium/dns"
      - "{{ DATA_ROOT }}/dns-server/data:/var/lib/dns"
    environment:
      - DNS_SERVER_DOMAIN={{ DNS_SERVER_DOMAIN }}
      - DNS_SERVER_ADMIN_PASSWORD={{ DNS_ADMIN_PASSWORD }}
      - DNS_SERVER_LOG_FOLDER_PATH=/var/log/technitium/dns
      - DNS_SERVER_RECURSION={{ DNS_RECURSION_MODE }}
      - DNS_SERVER_FORWARDERS={{ DNS_FORWARDERS }}
      - DNS_SERVER_FORWARDER_PROTOCOL={{ DNS_FORWARDER_PROTOCOL }}
    restart: unless-stopped
networks:
  njorddeploy_net:
    external: true