# status: "tested"
# last_tested_version: "3.13.15"
# platform_notes: "Tested on Proxmox LXC: docker (latest, 2026-09-12), podman (2026.08.28, 2026-09-12); Proxmox VM: docker (2026.08.28, 2026-09-12), podman (3.13.15, 2026-09-13)."
# breaking_changes: none
services:
  metube:
    image: "{{ image_name }}:{{ component_version }}"
    container_name: njorddeploy-metube
    restart: unless-stopped
    ports:
      - "{{ METUBE_WEB_PORT }}:8081"
    volumes:
      - "{{ CONFIG_BASE_PATH }}/metube/downloads:/downloads"
    networks:
      - njorddeploy_net

networks:
  njorddeploy_net:
    external: true
